name: Build desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
            python: '3.12'
            python_arch: arm64
          - os: windows-latest
            target: windows-x64
            python: '3.12'
            python_arch: x64
          - os: ubuntu-latest
            target: linux-x64
            python: '3.11'
            python_arch: x64
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      BUILD_TARGET: ${{ matrix.target }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate semantic version and native architecture
        id: version
        run: |
          python - <<'PY'
          import os, platform, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', tag):
              raise SystemExit('Use a semantic version tag, such as v1.0.0 or v1.0.0-rc.1.')
          expected = 'arm64' if os.environ['BUILD_TARGET'] == 'macos-arm64' else 'x86_64'
          actual = platform.machine().lower().replace('amd64', 'x86_64').replace('aarch64', 'arm64')
          if actual != expected:
              raise SystemExit(f'Runner architecture is {actual}; expected {expected}.')
          # The app uses the full tag on every platform, including prereleases.
          Path('VERSION').write_text(tag[1:] + '\n', encoding='utf-8')
          prerelease = '-' in tag.split('+', 1)[0]
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as stream:
              stream.write(f'prerelease={str(prerelease).lower()}\n')
          PY

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Download and verify static FFmpeg and FFprobe
        run: python scripts/fetch_ffmpeg.py --target "$BUILD_TARGET"

      - name: Run regression tests and source encode check
        run: |
          python -m unittest discover -s tests -v
          python main.py --self-test

      - name: Build native application with bundled tools
        run: python -m PyInstaller --clean --noconfirm DiscordVideoCompressor.spec

      - name: Test packaged application without FFmpeg on PATH
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          target = os.environ['BUILD_TARGET']
          executable = {
              'macos-arm64': 'dist/DiscordVideoCompressor.app/Contents/MacOS/DiscordVideoCompressor',
              'windows-x64': 'dist/DiscordVideoCompressor.exe',
              'linux-x64': 'dist/DiscordVideoCompressor',
          }[target]
          env = os.environ.copy()
          env['PATH'] = ''
          # GUI-subsystem applications on Windows do not reliably print to a pipe.
          # A nonzero exit code still fails the build.
          subprocess.run([str(Path(executable).resolve()), '--self-test'],
                         env=env, check=True, timeout=180)
          PY

      - name: Package platform asset
        run: |
          python - <<'PY'
          import hashlib, os, shutil, subprocess, tarfile, zipfile
          from pathlib import Path
          target, tag = os.environ['BUILD_TARGET'], os.environ['RELEASE_TAG']
          output = Path('release-assets')
          output.mkdir(exist_ok=True)
          name = f'DiscordVideoCompressor-{tag}-{target}'
          if target == 'macos-arm64':
              asset = output / f'{name}.zip'
              # ditto preserves app symlinks, execute bits, and the bundle layout.
              subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent',
                              'dist/DiscordVideoCompressor.app', str(asset)], check=True)
          else:
              stage = Path('build') / name
              stage.mkdir(parents=True, exist_ok=True)
              executable = 'DiscordVideoCompressor' + ('.exe' if target == 'windows-x64' else '')
              shutil.copy2(Path('dist') / executable, stage / executable)
              for document in ['README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md']:
                  shutil.copy2(document, stage / document)
              shutil.copy2('binaries/build-manifest.json', stage / 'build-manifest.json')
              if Path('binaries/licenses').is_dir():
                  shutil.copytree('binaries/licenses', stage / 'licenses', dirs_exist_ok=True)
              if target == 'windows-x64':
                  asset = output / f'{name}.zip'
                  with zipfile.ZipFile(asset, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
                      for item in sorted(stage.rglob('*')):
                          if item.is_file():
                              archive.write(item, item.relative_to(stage.parent))
              else:
                  asset = output / f'{name}.tar.gz'
                  with tarfile.open(asset, 'w:gz') as archive:
                      archive.add(stage, arcname=name)
          with asset.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          (output / f'{asset.name}.sha256').write_text(f'{digest}  {asset.name}\n', encoding='utf-8')
          PY

      - name: Upload tested release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all tested platform assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create release and attach all assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Discord Video Compressor ${{ github.ref_name }}
          draft: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256
